<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ settings.app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}" />
    <script defer src="{{ url_for('static', path='/app.js') }}"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a href="/" class="brand">{{ settings.app_name }}</a>
        <nav class="header-actions" aria-label="主要操作">
          <a class="ghost-button small-button" href="/export/transfer-summary.xlsx">陸送一覧Excel</a>
        </nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
